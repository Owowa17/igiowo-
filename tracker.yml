name: Daily Result Tracker

on:
  schedule:
    # 23:00 UTC is 12:00 AM (Midnight) Nigeria Time (WAT)
    - cron: '0 23 * * *'
  workflow_dispatch: # Allows you to test it manually

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write 

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10 
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Result Tracker
        env:
          FC_API_KEY: ${{ secrets.FC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python track_results.py

      - name: Commit Updated History File
        run: |
          git config --local user.name "IgiowoBot"
          git config --local user.email "bot@igiowo.com"
          git add picks_history.json
          
          if git diff --staged --quiet; then
            echo "No results to update. Skipping push."
          else
            echo "Results updated! Committing and pushing..."
            git commit -m "Update match results and win rate"
            git pull --rebase origin main
            git push origin main
          fi
