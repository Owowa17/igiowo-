name: Daily AI Betting Scanner

on:
  schedule:
    # Runs at 07:00 UTC (8:00 AM Nigeria time)
    - cron: '0 7 * * *'
  workflow_dispatch: # Allows you to run it manually only when you want to

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run daily scan
        env:
          FC_API_KEY: ${{ secrets.FC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_picks.py
