name: Daily AI Betting Scanner

on:
  schedule:
    # 07:00 UTC is exactly 08:00 AM Nigeria Time (WAT)
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10 
    
    steps:
      - name: Checkout repository
        # Updated to v5 to fix the Node.js 20 deprecation warning
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 

      - name: Set up Python
        # Updated to v6 to fix the Node.js 20 deprecation warning
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run daily scan & tracker
        env:
          FC_API_KEY: ${{ secrets.FC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_picks.py

      - name: Commit History File
        run: |
          git config --local user.name "IgiowoBot"
          git config --local user.email "bot@igiowo.com"
          git add picks_history.json
          
          if git diff --staged --quiet; then
            echo "No changes to picks_history.json. Skipping commit and push."
          else
            echo "Changes detected. Committing and pushing..."
            git commit -m "Update picks history"
            
            # THIS IS THE MAGIC LINE THAT PREVENTS THE PUSH REJECTION
            git pull --rebase origin main
            
            git push origin main
            echo "History file successfully updated!"
          fi
