name: Daily AI Betting Scanner

on:
  schedule:
    # 07:00 UTC is exactly 08:00 AM Nigeria Time (WAT)
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write # Crucial: Allows the bot to save the history file

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run daily scan & tracker
        env:
          FC_API_KEY: ${{ secrets.FC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_picks.py

      - name: Commit History File
        run: |
          git config --global user.name "IgiowoBot"
          git config --global user.email "bot@igiowo.com"
          git add picks_history.json || true
          git commit -m "Update picks history" || true
          git push || true
