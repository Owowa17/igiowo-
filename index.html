<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .affiliate-banner h3 { color: white; margin-top: 0; font-size: 1.1rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .affiliate-banner p { color: white; margin-bottom: 15px; font-size: 0.9rem; }
  .affiliate-btn { display: inline-block; background-color: #FFFFFF; color: #FF4B4B; font-weight: bold; padding: 12px 30px; border-radius: 50px; text-decoration: none; font-size: 1rem; margin-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: transform 0.2s; }

  .summary-item { text-align: center; }

  .date-count { font-weight: 400; font-size: 12px; opacity: 0.8; }
  .today-badge { background: #FF3B30; color: #FFFFFF; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; margin-left: 8px; }
  .card { background: #FBF8EF; padding: 14px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid #D4AF37; }
  .card.today { border-left-color: #FF3B30; box-shadow: 0 0 0 2px rgba(255, 59, 48, 0.2); }
  .card.u25 { border-left-color: #7E22CE; background: #FAF5FF; }

  /* 🛡️ U3.5 STYLING */
  .card.u35 { border-left-color: #1B5E20; background: #F1F7F3; }
  .card.u35 .prob-fill { background: linear-gradient(90deg, #1B5E20, #D4AF37); }
  .card.u35 .prob-text { color: #1B5E20; }

  .card.win { border-left-color: #1B5E20; }
  .card.loss { border-left-color: #B71C1C; }
  .card.void { border-left-color: #999; opacity: 0.7; }
  .match { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .league { font-size: 12px; color: #666; margin-bottom: 8px; }
  .market-badge { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 10px; font-weight: 700; margin-right: 6px; }
  .badge-u15 { background: #D4AF37; color: #1B1B1B; }
  .badge-u25 { background: #7E22CE; color: #FFFFFF; }
  .prob-bar { background: #E5E5E5; border-radius: 20px; height: 8px; overflow: hidden; margin-bottom: 6px; margin-top: 6px; }
  .prob-fill { background: linear-gradient(90deg, #0B3D2E, #D4AF37); height: 100%; border-radius: 20px; }
  .prob-text { font-size: 13px; font-weight: 600; color: #0B3D2E; display: flex; justify-content: space-between; }
  .result-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; margin-top: 4px; }
  .result-win { color: #1B5E20; }
  .result-loss { color: #B71C1C; }
  .result-void { color: #666; }
  .hit-note { font-size: 11px; color: #666; font-weight: 400; }
  .stats { background: #F1F7F3; padding: 16px; border-radius: 10px; margin-top: 20px; }
  .stats h2 { color: #0B3D2E; font-size: 16px; margin-bottom: 12px; }
  .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #ddd; }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { color: #666; font-size: 13px; }
  .stat-value { font-weight: 700; color: #0B3D2E; font-size: 15px; }
  .hit-bar { background: #E5E5E5; border-radius: 20px; height: 14px; overflow: hidden; margin: 10px 0; }
  .hit-fill { background: linear-gradient(90deg, #1B5E20, #D4AF37); height: 100%; border-radius: 20px; transition: width 0.5s ease; }
  .filter-row { display: flex; gap: 6px; margin-bottom: 14px; }
  .filter-btn { flex: 1; padding: 10px 6px; border-radius: 8px; background: rgba(251, 248, 239, 0.15); color: #FBF8EF; font-weight: 600; font-size: 12px; text-align: center; cursor: pointer; border: none; }
  .filter-btn.active { background: #D4AF37; color: #1B1B1B; }
  .loading { text-align: center; color: #FBF8EF; padding: 40px; font-size: 16px; }
  .error { background: #FDE2E2; color: #B71C1C; padding: 20px; border-radius: 10px; text-align: center; }
  .empty { text-align: center; color: #FBF8EF; padding: 30px; font-size: 14px; opacity: 0.8; }
  .hidden { display: none; }
  .legend { display: flex; gap: 12px; justify-content: center; margin-bottom: 12px; font-size: 11px; color: #FBF8EF; opacity: 0.85; flex-wrap: wrap; }
  .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

</head>
<body>
  <div class="header">
    <h1>⚽ Igiowo</h1>
    <p>Multi-Market Prediction Dashboard</p>
  </div>

  <div class="affiliate-banner">
      <h3>🔥 Ready to place today's bets?</h3>
      <p>Join 1win using our exclusive code to get the best odds!</p>
      <a href="https://1win.ng/?p=q70f" target="_blank" class="affiliate-btn">
          👉 Register on 1win Here
      </a>
      <div class="promo-code">
          🎁 Promo Code: <span>IGIOWO</span>
      </div>
  </div>

  <a href="https://t.me/IgiowoHQ" target="_blank" class="telegram-btn">
      📢 Join our Telegram for Daily Picks
  </a>

  <div class="tabs">
    <button class="tab active" id="tabToday" onclick="switchTab('today')">Today</button>
    <button class="tab" id="tabHistory" onclick="switchTab('history')">History</button>
  </div>

  <div class="legend">
    <span><span class="legend-dot" style="background:#D4AF37"></span>HT Under 1.5</span>
    <span><span class="legend-dot" style="background:#7E22CE"></span>FT Under 2.5</span>
    <span><span class="legend-dot" style="background:#1B5E20"></span>FT Under 3.5</span>
  </div>

  <div id="todayView">
    <div id="todayContent" class="loading">Loading predictions...</div>
  </div>

  <div id="historyView" class="hidden">
    <div class="filter-row">
      <button class="filter-btn active" id="filterAll" onclick="setFilter('all')">All Time</button>
      <button class="filter-btn" id="filter7" onclick="setFilter('7')">Last 7 Days</button>
      <button class="filter-btn" id="filter30" onclick="setFilter('30')">Last 30 Days</button>
    </div>
    <div id="historyContent" class="loading">Loading history...</div>
  </div>

  <script>
    const JSON_URL = "https://corsproxy.io/?https://raw.githubusercontent.com/Owowa17/igiowo-/main/picks_history.json";
    let allData = [];
    let currentFilter = "all";

    function switchTab(tab) {
      document.getElementById('tabToday').classList.toggle('active', tab === 'today');
      document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
      document.getElementById('todayView').classList.toggle('hidden', tab !== 'today');
      document.getElementById('historyView').classList.toggle('hidden', tab !== 'history');
      if (tab === 'history') renderHistory();
    }

    function setFilter(f) {
      currentFilter = f;
      document.getElementById('filterAll').classList.toggle('active', f === 'all');
      document.getElementById('filter7').classList.toggle('active', f === '7');
      document.getElementById('filter30').classList.toggle('active', f === '30');
      renderHistory();
    }

    async function loadData() {
      try {
        const response = await fetch(JSON_URL + "?t=" + new Date().getTime());
        if (!response.ok) throw new Error("Could not load data");
        
        const rawData = await response.json();
        
        let pending = [];
        let completed = [];
        const seen = new Set();
        
        const today = new Date();

        rawData.forEach(pick => {
          if (!pick.match || !pick.date) return;
          
          // 🚨 DYNAMIC MARKET PARSING
          const marketString = pick.market || "HT Under 1.5";
          let market = "u15";
          if (marketString.includes("2.5")) market = "u25";
          if (marketString.includes("3.5")) market = "u35";
          
          // 🚨 DATE FIX
          let pickDate = pick.date;
          if (pickDate.startsWith("2026") || pickDate.startsWith("2025")) {
             pickDate = today.toISOString().split('T')[0];
          }
          
          const kickoff = pickDate + "T" + (pick.time || "12:00");
          const prob = pick.prob / 100; 
          const result = pick.result || "PENDING";
          
          const dedupKey = pick.match + "|" + pickDate + "|" + market;
          
          if (result === "PENDING" && !seen.has(dedupKey)) {
            seen.add(dedupKey);
            pending.push({ 
                date: pickDate, match: pick.match, league: pick.league || "Unknown", 
                kickoff: kickoff, prob: prob, notes: "", market: market 
            });
          }
          
          if (result === "WON" || result === "LOST") {
            completed.push({ 
                date: pickDate, match: pick.match, league: pick.league || "Unknown", 
                kickoff: kickoff, prob: prob, 
                result: result === "WON" ? "Win" : "Loss", notes: "", market: market 
            });
          }
        });

        allData = { pending, completed };
        renderToday();
        if (!document.getElementById('historyView').classList.contains('hidden')) renderHistory();
        
      } catch (e) {
        console.error(e);
        document.getElementById('todayContent').innerHTML = '<div class="error">Error loading data. Ensure URL is correct.</div>';
      }
    }

    function renderCard(p, isToday, showResult) {
      const probPct = (p.prob * 100).toFixed(1);
      let timeStr = "TBD";
      try {
          timeStr = new Date(p.kickoff).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
      } catch(e) {}
      
      const isU25 = p.market === "u25";
      const isU35 = p.market === "u35";
      
      // Determine Styling
      let cardClass = isToday ? "today" : "";
      let badge = '<span class="market-badge badge-u15">HT U1.5</span>';
      let label = "HT U1.5";
      
      if (isU25) {
          cardClass = "u25";
          badge = '<span class="market-badge badge-u25">📉 FT U2.5</span>';
          label = "FT U2.5";
      } else if (isU35) {
          cardClass = "u35";
          badge = '<span class="market-badge badge-u35">🛡️ FT U3.5</span>';
          label = "FT U3.5";
      }

      let html = `<div class="card ${cardClass}">
        <div class="match">${p.match}</div>
        <div class="league">${badge}${p.league} • ${timeStr}</div>
        <div class="prob-bar"><div class="prob-fill" style="width:${probPct}%"></div></div>
        <div class="prob-text"><span>${label}</span><span>${probPct}%</span></div>`;

      if (showResult) {
        const resultClass = p.result === "Win" ? "result-win" : p.result === "Loss" ? "result-loss" : "result-void";
        const icon = p.result === "Win" ? "✅" : p.result === "Loss" ? "❌" : "⏸";
        html += `<div class="result-row">
          <span class="${resultClass}">${icon} ${p.result}</span>
          <span class="hit-note">${p.notes || ''}</span>
        </div>`;
      }

      html += `</div>`;
      return html;
    }

    function renderToday() {
      const pending = allData.pending.slice();
      pending.sort((a, b) => {
        const tA = new Date(a.kickoff).getTime();
        const tB = new Date(b.kickoff).getTime();
        if (tA !== tB) return tA - tB;
        return b.prob - a.prob;
      });

      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const tomorrow = new Date(today.getTime() + 24 * 60 * 60 * 1000);
      const todayKey = today.toISOString().split('T')[0];
      const tomorrowKey = tomorrow.toISOString().split('T')[0];

      const groups = {};
      pending.forEach(p => {
        const key = p.date; 
        if (!groups[key]) groups[key] = { date: new Date(p.date), picks: [] };
        groups[key].picks.push(p);
      });

      const todayCount = groups[todayKey] ? groups[todayKey].picks.length : 0;
      const tomorrowCount = groups[tomorrowKey] ? groups[tomorrowKey].picks.length : 0;
      const u15Count = pending.filter(p => p.market === "u15").length;
      const u25Count = pending.filter(p => p.market === "u25").length;
      const u35Count = pending.filter(p => p.market === "u35").length;

      let html = `<div class="summary-bar">
        <div class="summary-item"><div class="summary-num">${todayCount}</div><div class="summary-label">Today</div></div>
        <div class="summary-item"><div class="summary-num">${tomorrowCount}</div><div class="summary-label">Tomorrow</div></div>
        <div class="summary-item"><div class="summary-num">${u15Count}</div><div class="summary-label">HT U1.5</div></div>
        <div class="summary-item"><div class="summary-num">${u25Count}</div><div class="summary-label">FT U2.5</div></div>
        <div class="summary-item"><div class="summary-num">${u35Count}</div><div class="summary-label">FT U3.5</div></div>
      </div>`;

      if (pending.length === 0) {
        html += '<div class="error">No pending picks. Check back later!</div>';
      } else {
        const sortedKeys = Object.keys(groups).sort();
        sortedKeys.forEach(key => {
          const grp = groups[key];
          const isToday = key === todayKey;
          const isTomorrow = key === tomorrowKey;
          let dateLabel;
          if (isToday) dateLabel = "Today";
          else if (isTomorrow) dateLabel = "Tomorrow";
          else dateLabel = grp.date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

          html += `<div class="date-group">
            <div class="date-header">
              <span>${dateLabel}${isToday ? '<span class="today-badge">NOW</span>' : ''}</span>
              <span class="date-count">${grp.picks.length} pick${grp.picks.length !== 1 ? 's' : ''}</span>
            </div>`;

          grp.picks.forEach(p => { html += renderCard(p, isToday, false); });
          html += `</div>`;
        });
      }

      document.getElementById('todayContent').className = "";
      document.getElementById('todayContent').innerHTML = html;
    }

    function renderHistory() {
      const completed = allData.completed.slice();
      let filtered = completed;

      if (currentFilter === "7" || currentFilter === "30") {
        const days = parseInt(currentFilter);
        const cutoff = new Date();
        cutoff.setDate(cutoff.getDate() - days);
        filtered = completed.filter(c => {
          const d = new Date(c.date);
          return d >= cutoff;
        });
      }

      const u15 = filtered.filter(r => r.market === "u15");
      const u25 = filtered.filter(r => r.market === "u25");
      const u35 = filtered.filter(r => r.market === "u35");

      function stats(arr) {
        const w = arr.filter(r => r.result === "Win").length;
        const l = arr.filter(r => r.result === "Loss").length;
        const t = w + l;
        return { wins: w, losses: l, total: t, hit: t > 0 ? (w / t * 100).toFixed(1) : "—" };
      }

      const s15 = stats(u15);
      const s25 = stats(u25);
      const s35 = stats(u35);

      let html = "";

      if (filtered.length === 0) {
        html += `<div class="empty">No settled picks yet for this period.</div>`;
      } else {
        if (s15.total > 0) {
          html += `<div class="stats">
            <h2>🎯 HT Under 1.5 Track Record</h2>
            <div class="stat-row"><span class="stat-label">Total Settled</span><span class="stat-value">${s15.total}</span></div>
            <div class="stat-row"><span class="stat-label">Wins</span><span class="stat-value" style="color:#1B5E20">${s15.wins}</span></div>
            <div class="stat-row"><span class="stat-label">Losses</span><span class="stat-value" style="color:#B71C1C">${s15.losses}</span></div>
            <div class="stat-row"><span class="stat-label">Hit Rate</span><span class="stat-value">${s15.hit}%</span></div>
            <div class="hit-bar"><div class="hit-fill" style="width:${s15.hit}%"></div></div>
          </div>`;
        }

        if (s25.total > 0) {
          html += `<div class="stats" style="background:#FAF5FF;">
            <h2 style="color:#7E22CE;">📉 FT Under 2.5 Track Record</h2>
            <div class="stat-row"><span class="stat-label">Total Settled</span><span class="stat-value" style="color:#7E22CE">${s25.total}</span></div>
            <div class="stat-row"><span class="stat-label">Wins</span><span class="stat-value" style="color:#1B5E20">${s25.wins}</span></div>
            <div class="stat-row"><span class="stat-label">Losses</span><span class="stat-value" style="color:#B71C1C">${s25.losses}</span></div>
            <div class="stat-row"><span class="stat-label">Hit Rate</span><span class="stat-value" style="color:#7E22CE">${s25.hit}%</span></div>
            <div class="hit-bar"><div class="hit-fill" style="background:linear-gradient(90deg,#7E22CE,#D4AF37);width:${s25.hit}%"></div></div>
          </div>`;
        }

        if (s35.total > 0) {
          html += `<div class="stats" style="background:#F1F7F3;">
            <h2 style="color:#1B5E20;">🛡️ FT Under 3.5 Track Record</h2>
            <div class="stat-row"><span class="stat-label">Total Settled</span><span class="stat-value" style="color:#1B5E20">${s35.total}</span></div>
            <div class="stat-row"><span class="stat-label">Wins</span><span class="stat-value" style="color:#1B5E20">${s35.wins}</span></div>
            <div class="stat-row"><span class="stat-label">Losses</span><span class="stat-value" style="color:#B71C1C">${s35.losses}</span></div>
            <div class="stat-row"><span class="stat-label">Hit Rate</span><span class="stat-value" style="color:#1B5E20">${s35.hit}%</span></div>
            <div class="hit-bar"><div class="hit-fill" style="background:linear-gradient(90deg,#1B5E20,#D4AF37);width:${s35.hit}%"></div></div>
          </div>`;
        }

        const sortedByDate = filtered.slice().sort((a, b) => new Date(b.date) - new Dat
